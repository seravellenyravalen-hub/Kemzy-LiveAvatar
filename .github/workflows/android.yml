name: Android

on:
  push:
    branches:
      - feature/live-ai-device-diagnostic
  pull_request:
    branches:
      - feature/live-ai-device-diagnostic

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run JVM tests and build debug APK
        run: gradle test assembleDebug --no-daemon

      - name: Rename branded APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/kemzyavatar.apk

      - name: Upload branded APK
        uses: actions/upload-artifact@v4
        with:
          name: kemzyavatar-apk
          path: android/app/build/outputs/apk/debug/kemzyavatar.apk
          if-no-files-found: error
