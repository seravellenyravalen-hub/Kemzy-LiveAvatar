name: Download CI 296 APK

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout exact CI 296 source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Debug APK build
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload exact CI 296 APK
        uses: actions/upload-artifact@v4
        with:
          name: Kemzy-LiveAvatar-CI296-EXACT-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
